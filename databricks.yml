bundle:
  name: vehicle-telemetry-lakehouse
variables:
  cluster_id:
    description: Existing compatible Databricks cluster ID (Spark 3.5/Delta runtime)
  lakehouse_root:
    description: Existing Unity Catalog Volume path for synthetic data
resources:
  jobs:
    telemetry:
      name: vehicle-telemetry-lakehouse-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: medallion
          existing_cluster_id: ${var.cluster_id}
          spark_python_task:
            python_file: ${workspace.file_path}/deploy/databricks/job.py
            parameters: [--home, '${var.lakehouse_root}', --seed-demo]
          libraries:
            - pypi:
                package: filelock==3.18.0
targets:
  dev:
    mode: development
    default: true

name: Release and publish package
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Determine release version
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'TAG=v{version}\n')
              f.write('IMAGE=ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower() + '\n')
          PY
      - name: Refuse an existing release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists. Increment pyproject.toml and update release notes."
            exit 1
          fi
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - name: Build downloadable source and Python wheel
        run: |
          python -m build --wheel --no-isolation
          git archive --format=zip --prefix=vehicle-telemetry-lakehouse/ --output="dist/vehicle-telemetry-lakehouse-$TAG.zip" HEAD
      - name: Build container and verify process health
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE:$TAG" .
          docker run -d --name fleet-smoke -p 127.0.0.1:8000:8000 "$IMAGE:$TAG"
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health
          docker stop fleet-smoke
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish container package
        run: docker push "$IMAGE:$TAG"
      - name: Publish GitHub release
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Fleet Pulse $TAG — Vehicle Telemetry Lakehouse" --notes-file RELEASE_NOTES.md
